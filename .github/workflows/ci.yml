name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: iscp-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ISCP_RELAY_TEST_DSN: postgres://postgres:iscp-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      ISCP_RELAY_LONG_QUALIFICATION: "1"
      ISCP_RELAY_RESTART_QUALIFICATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build immutable pre-duplex Relay for writer-fence qualification
        shell: bash
        run: |
          baseline_dir="$(mktemp -d "${RUNNER_TEMP}/iscp-baseline.XXXXXX")"
          git archive 47f1f6c231c56c92eff6b6c5d398e037ebcf9602 | tar -x -C "$baseline_dir"
          (cd "$baseline_dir" && go build -o "${RUNNER_TEMP}/iscp-old-relayd" ./services/relay-reference/cmd/relayd)
          echo "ISCP_RELAY_OLD_BINARY=${RUNNER_TEMP}/iscp-old-relayd" >> "$GITHUB_ENV"
          echo "ISCP_RELAY_OLD_BINARY_SHA256=$(sha256sum "${RUNNER_TEMP}/iscp-old-relayd" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
      - run: go test -race ./...
      - run: go vet ./...

  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: ./scripts/release-gate.sh
      - name: Show reference-service diagnostics on failure
        if: failure()
        run: docker compose -f deploy/docker-compose/docker-compose.yaml logs --no-color --tail 200
      - name: Retain release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: |
            dist/
            conformance/report.json
          retention-days: 7
      - name: Stop disposable reference services
        if: always()
        run: docker compose -f deploy/docker-compose/docker-compose.yaml down --volumes
